name: Build and publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4"]
        node_version: [20, 22, 24]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            NODE_VERSION=${{ matrix.node_version }}
          tags: ${{ steps.image.outputs.name }}:php${{ matrix.php_version }}-node${{ matrix.node_version }}
          cache-from: type=gha,scope=php${{ matrix.php_version }}-node${{ matrix.node_version }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php_version }}-node${{ matrix.node_version }}

  update-readme:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update images table in README
        run: |
          python3 - <<'EOF'
          import re

          php_versions = ["8.3", "8.4"]
          node_versions = [20, 22, 24]
          pkgs_url = "https://github.com/metadrop/drupal-artifact-builder-docker/pkgs/container/drupal-artifact-builder-docker"
          image = "ghcr.io/metadrop/drupal-artifact-builder-docker"

          header = "| |" + "".join(f" Node {n} |" for n in node_versions)
          separator = "|---|" + "---|" * len(node_versions)
          rows = []
          for php in php_versions:
              cells = "".join(
                  f" [`{image}:php{php}-node{n}`]({pkgs_url}) |"
                  for n in node_versions
              )
              rows.append(f"| **PHP {php}** |{cells}")

          table = "\n".join([header, separator] + rows)
          new_block = f"<!-- IMAGES-TABLE-START -->\n{table}\n<!-- IMAGES-TABLE-END -->"

          with open("README.md", "r") as f:
              content = f.read()

          updated = re.sub(
              r"<!-- IMAGES-TABLE-START -->.*?<!-- IMAGES-TABLE-END -->",
              new_block,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(updated)
          EOF

      - name: Commit if changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git diff --quiet README.md && echo "No changes" || (
            git add README.md
            git commit -m "Update published images table [skip ci]"
            git push
          )
