name: Build and publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4"]
        node_version: [20, 22, 24]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:php${{ matrix.php_version }}-node${{ matrix.node_version }}"
          if [[ "${{ matrix.php_version }}" == "8.3" && "${{ matrix.node_version }}" == "20" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            NODE_VERSION=${{ matrix.node_version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=php${{ matrix.php_version }}-node${{ matrix.node_version }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php_version }}-node${{ matrix.node_version }}
